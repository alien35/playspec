name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify CLI Help
        run: node --experimental-strip-types src/cli.ts help
      - name: Verify CLI List
        run: node --experimental-strip-types src/cli.ts list
